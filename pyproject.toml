[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vt"
version = "0.1.0"
description = "Spec-driven video editing: word-anchored overlays, intros/outros, rendered with ffmpeg"
requires-python = ">=3.10"
dependencies = [
  "faster-whisper>=1.0",
  "ruamel.yaml>=0.18",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vt = "vt.cli:main"

[tool.setuptools.packages.find]
include = ["vt*"]

[tool.setuptools.package-data]
vt = ["presets/*.yaml", "templates/project/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not e2e'"
markers = ["e2e: end-to-end tests that run ffmpeg/whisper (slow)"]
